<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Monthly Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Enhanced Monthly Expense Tracker</h1>

        <div class="summary-section">
            <div class="summary-card">
                <h2>Total Monthly Expense:</h2>
                <p id="total-expense" class="total-amount">$0.00</p>
            </div>
        </div>

        <div class="add-expense-section">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-date">Date:</label>
                    <input type="date" id="expense-date" required>
                </div>
                <div class="form-group">
                    <label for="expense-category">Category:</label>
                    <input type="text" id="expense-category" placeholder="e.g., Groceries, Rent" required>
                </div>
                <div class="form-group">
                    <label for="expense-amount">Amount:</label>
                    <input type="number" id="expense-amount" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="expense-description">Description (Optional):</label>
                    <input type="text" id="expense-description" placeholder="e.g., Weekly shopping">
                </div>
                <button type="submit">Add Expense</button>
            </form>
        </div>

        <div class="expenses-list-section">
            <h2>All Expenses</h2>
            <table id="expenses-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expenses-table-body">
                    <!-- Expenses will be inserted here -->
                </tbody>
            </table>
        </div>

        <div class="top-categories-section">
            <h2>Top 10 Spending Categories</h2>
            <div id="top-categories-list">
                <!-- Top categories will be inserted here -->
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
